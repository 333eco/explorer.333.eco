name = "explorer-333-eco"
compatibility_date = "2026-09-01"
# Static assets only, no Worker code: the host holds nothing, and every check runs in the reader's browser.
# ⚠️ SPEC said Cloudflare Pages. Static assets on Workers is the same CDN, with the custom domain set here instead of by hand. dist/ is built by `npm run build`.
routes = [{ pattern = "explorer.333.eco", custom_domain = true }]
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
