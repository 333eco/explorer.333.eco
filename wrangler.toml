name = "explorer-333-eco"
compatibility_date = "2026-09-01"
# Cloudflare Pages, static only: no Functions, so every request is a free one. The host holds nothing, and every check runs in the reader's browser.
# ⚠️ No 404.html on purpose: Pages then answers an unknown path with index.html, which is what the client-side pages need.
pages_build_output_dir = "./dist"
